<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dmint Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold letter-spacing-1" href="/">
        <span class="text-warning">DMINT</span>
        <span class="text-white-50 fw-normal ms-1 fs-6">Dashboard</span>
      </a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
              Approvals
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.url.path == '/audit' %}active{% endif %}" href="/audit">
              Audit
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    {% if flash_message %}
    <div class="alert alert-{{ flash_type }} alert-dismissible fade show" role="alert">
      {{ flash_message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    {% block content %}{% endblock %}

  </main>

  <footer class="border-top mt-5 py-3 text-center text-muted small">
    <div class="container">
      Dmint Dashboard V1 &mdash;
      <strong class="text-danger">No authentication</strong> &mdash;
      Local/demo use only. &mdash;
      Core-owned SQLite.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmzOtFSbBVgJvTGJBDgaAMfpBR7F"
          crossorigin="anonymous"></script>
</body>
</html>
